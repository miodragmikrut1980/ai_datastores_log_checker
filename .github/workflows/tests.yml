name: Tests

# Runs the jsdom/integration suite and the real-browser E2E suite
# on every push and pull request — the "no CI" gap flagged in review.
# Deliberately minimal: this repo's actual quality gate is the tests
# themselves (216 UI + 16 server + 14 security + 9 accessibility, each regression tied to a specific
# incident scenario that was actually role-played, not just imagined) —
# this workflow just makes sure they run automatically instead of relying
# on someone remembering to run `npm test` before pushing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run test suite
        run: npm test

      - name: Install Chrome for real-browser E2E tests
        run: npx puppeteer browsers install chrome

      - name: Run real-browser E2E suite
        run: npm run test:e2e

      - name: Fail on any test failure
        if: failure()
        run: |
          echo "::error::Test suite failed — see the 'Run test suite' step above for which test(s) broke."
          exit 1
